name: Documentation and history

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check generated documentation and change coverage
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$DOCS_BASE" ]; then
            python3 -B scripts/update_docs.py --check --base "$DOCS_BASE"
          else
            python3 -B scripts/update_docs.py --check
          fi
      - name: Validate plugin and run offline tests
        run: |
          python3 -B scripts/check_plugin.py
          python3 -B -m unittest discover -s tests -q
